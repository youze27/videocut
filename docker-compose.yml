services:
  videocut:
    build: .
    # Keep alive to serve the web UI and run the daily scheduler.
    restart: unless-stopped
    ports:
      - "8080:8080"
    # ── NAS 视频目录挂载 ─────────────────────────────────────────────
    # 左侧改成你自己的 NAS 路径（群晖 / 威联通 / 绿联等路径不同）。
    # 右侧 /host 是容器内固定路径：UI 里输入目录填 /host 或其子目录。
    # 例：
    #   群晖    /volume1/camera_videos:/host
    #   威联通  /volume1/camera_videos:/host
    #   绿联    /vol1/1000/camera_videos:/host
    # /work 存放抽帧临时文件与数据库，必须与视频目录同盘（同一文件系统），
    # 否则 -ss 精确定位会退化为全量解码，耗时成倍上升。
    volumes:
      - /volume1/camera_videos:/host
      - /volume1/camera_videos/.videocut_work:/work
      # 挂载本地源码，改代码无需重建镜像（热修便利）。
      # 若希望使用镜像内烘焙的代码，删掉这两行后执行 docker compose build。
      - ./src:/app/src
      - ./ui:/app/ui
    environment:
      TZ: Asia/Shanghai
      WORK_DIR: /work
