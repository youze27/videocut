<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAS 智慧家视觉检测事件监控大屏</title>
<style>
  :root{
    --bg:#121418; --card:#1E2229; --fg:#e6e6e6; --muted:#9aa0aa;
    --line:#2a2f3a;
    /* object labels */
    --obj-person:#D32F2F; --obj-cat:#F57C00; --obj-dog:#0277BD;
    /* pose labels */
    --pose-lie:#C62828; --pose-stand:#2E7D32; --pose-sit:#0097A7;
    --pose-squat:#FBC02D; --pose-bend:#6A1B9A; --pose-unknown:#757575; --pose-none:#424242;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,"Segoe UI",Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif;}
  a{color:#4f8cff;}

  /* ---------- top bar ---------- */
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);}
  header h1{font-size:18px;margin:0;white-space:nowrap;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:#0f1115;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:12px;color:var(--muted);}
  .stat b{color:var(--fg);font-size:15px;margin-right:4px;}
  .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 12px;
    font-size:13px;font-weight:600;background:#2a2f3a;color:var(--fg);}
  button.primary{background:#4f8cff;color:#fff;}
  .toggle.on{background:#3ecf8e;color:#04210f;}

  /* ---------- 全屏模式（5秒无操作自动进入） ---------- */
  body.kiosk header{padding:10px 24px;flex-wrap:wrap;}
  body.kiosk header h1{font-size:22px;}
  body.kiosk header .stat b{font-size:22px;}
  body.kiosk header .stat{font-size:14px;padding:4px 12px;}
  body.kiosk header .clock{font-size:22px;color:var(--fg) !important;
    font-weight:600;margin-left:auto;}
  /* 全屏模式：只保留顶部栏 + 轮播，隐藏筛选条、模式栏、actions */
  body.kiosk header .actions,
  body.kiosk .filters,
  body.kiosk .mode-bar{display:none !important;}
  body.kiosk #exit-kiosk{display:block;}
  #exit-kiosk{display:none;position:fixed;top:12px;right:12px;z-index:999;
    background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:6px;
    padding:8px 14px;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);}
  #exit-kiosk:hover{background:rgba(231,76,60,.85);}

  /* body 用 flex 布局：header 固定高度，slideshow 占满剩余空间 */
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}

  /* ---------- filter bar ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:10px;padding:12px 18px;
    background:#171a20;border-bottom:1px solid var(--line);}
  .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .group .lbl{font-size:12px;color:var(--muted);}
  .chip{border:1px solid var(--line);background:#0f1115;color:var(--fg);
    border-radius:14px;padding:5px 11px;font-size:12px;cursor:pointer;}
  .chip.active{background:#4f8cff;color:#fff;border-color:#4f8cff;}
  .filters input[type=text]{background:#0f1115;border:1px solid var(--line);
    color:var(--fg);border-radius:6px;padding:7px 10px;font-size:13px;min-width:160px;}

  /* ---------- 多选下拉框 ---------- */
  .multi-select{position:relative;display:inline-flex;flex-direction:column;}
  .ms-display{display:flex;align-items:center;gap:6px;background:#0f1115;
    border:1px solid var(--line);border-radius:6px;padding:7px 10px;
    cursor:pointer;font-size:13px;min-width:150px;user-select:none;
    transition:border-color .15s;}
  .ms-display:hover{border-color:#4f8cff;}
  .ms-display .ms-label{color:var(--muted);font-size:12px;}
  .ms-display .ms-selected{color:var(--fg);flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .ms-display .ms-arrow{color:var(--muted);font-size:11px;
    transition:transform .2s;}
  .multi-select.open .ms-arrow{transform:rotate(180deg);}
  .ms-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;
    min-width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:6px;padding:4px;z-index:30;max-height:260px;overflow:auto;
    box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .multi-select.open .ms-dropdown{display:block;}
  .ms-option{display:flex;align-items:center;gap:8px;padding:6px 8px;
    border-radius:4px;cursor:pointer;font-size:13px;color:var(--fg);}
  .ms-option:hover{background:#1d2230;}
  .ms-option input{accent-color:#4f8cff;cursor:pointer;margin:0;}
  .ms-option.ms-all{border-bottom:1px solid var(--line);margin-bottom:4px;}

  /* ---------- 单选下拉框（时间/布局/间隔筛选） ---------- */
  .single-select{position:relative;display:inline-flex;flex-direction:column;}
  /* 复用 .ms-display / .ms-dropdown / .ms-arrow 的样式，展开规则与多选一致 */
  .single-select.open .ms-dropdown{display:block;}
  .ms-option.ms-single{padding:6px 10px;border-radius:4px;cursor:pointer;
    font-size:13px;color:var(--fg);}
  .ms-option.ms-single:hover{background:#1d2230;}
  .ms-option.ms-single.active{background:rgba(79,140,255,.18);color:#4f8cff;
    font-weight:600;}

  /* ---------- 照片墙卡片 ---------- */
  /* main 占满剩余空间，无 padding 让轮播铺满 */
  main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;}

  /* ---------- 轮播配置栏 ---------- */
  .mode-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mode-bar .lbl{font-size:12px;color:var(--muted);}
  .mode-bar select{background:#0f1115;border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:6px 8px;font-size:12px;}

  /* ---------- 轮播模式（首页主展示，非全屏覆盖层） ---------- */
  /* slideshow 直接占据 header 下方的主区域，而非 fixed 全屏覆盖 */
  .slideshow{display:flex;flex-direction:column;flex:1;min-height:0;
    background:#000;position:relative;}
  .ss-stage{flex:1;display:grid;gap:6px;padding:6px;overflow:hidden;
    background:#000;width:100%;min-height:0;}
  /* 轮播单元：复用卡片样式（圆角 + 水印标签） */
  .ss-cell{position:relative;background:#000;overflow:hidden;
    border-radius:8px;cursor:pointer;}
  .ss-cell img{width:100%;height:100%;object-fit:cover;display:block;}
  /* 水印标签：对象+姿态，左下角，背景加深确保可读 */
  .ss-cell .wm-tags{position:absolute;left:0;bottom:0;display:flex;gap:3px;
    padding:3px 4px;}
  .ss-cell .wm-tags .tag{font-size:13px;font-weight:600;
    padding:2px 8px;border-radius:4px;color:#fff;
    background:rgba(0,0,0,.78);backdrop-filter:blur(2px);}
  .ss-cell .wm-tags .tag.obj-person{background:rgba(211,47,47,.92);}
  .ss-cell .wm-tags .tag.obj-cat{background:rgba(245,124,0,.92);}
  .ss-cell .wm-tags .tag.obj-dog{background:rgba(2,119,189,.92);}
  .ss-cell .wm-tags .tag.obj-horse{background:rgba(94,53,177,.92);}
  .ss-cell .wm-tags .tag.obj-bird{background:rgba(255,152,0,.95);color:#000;}
  .ss-cell .wm-tags .tag.obj-sheep{background:rgba(121,85,72,.92);}
  .ss-cell .wm-tags .tag.obj-cow{background:rgba(63,81,181,.92);}
  .ss-cell .wm-tags .tag.obj-unknown{background:rgba(117,117,117,.92);}
  .ss-cell .wm-tags .tag.pose-lie{background:rgba(198,40,40,.92);}
  .ss-cell .wm-tags .tag.pose-stand{background:rgba(46,125,50,.92);}
  .ss-cell .wm-tags .tag.pose-sit{background:rgba(0,151,167,.92);}
  .ss-cell .wm-tags .tag.pose-squat{background:rgba(251,192,45,.95);color:#000;}
  .ss-cell .wm-tags .tag.pose-bend{background:rgba(106,27,154,.92);}
  .ss-cell .wm-tags .tag.pose-unknown{background:rgba(117,117,117,.92);}
  .ss-cell .wm-tags .tag.pose-none{background:rgba(66,66,66,.92);}
  /* 日期：右上角 */
  .ss-cell .wm-date{position:absolute;right:0;top:0;font-size:12px;
    color:#fff;background:rgba(0,0,0,.78);backdrop-filter:blur(2px);
    padding:2px 8px;border-radius:0 8px 0 6px;}

  /* 控制条：底部，默认隐藏，鼠标靠近底部显示 */
  .ss-bar{position:absolute;left:0;right:0;bottom:0;z-index:5;
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:linear-gradient(transparent,rgba(10,12,16,.95) 40%);
    flex-wrap:wrap;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .slideshow:hover .ss-bar,
  .ss-bar:hover{opacity:1;pointer-events:auto;}
  .ss-bar .lbl{font-size:12px;color:var(--muted);}
  .ss-bar .ss-counter{font-size:12px;color:var(--muted);margin-right:auto;}
  .ss-bar select{background:#0f1115;border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:5px 8px;font-size:12px;}
  .ss-bar button{padding:6px 12px;font-size:12px;}
  .ss-progress{height:3px;background:#1a1d24;position:relative;overflow:hidden;
    flex-shrink:0;}
  .ss-progress-bar{height:100%;background:var(--accent);width:0;
    transition:width .1s linear;}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal.hidden{display:none;}
  .modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.72);}
  .modal-box{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:10px;max-width:85vw;width:900px;overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;}
  .modal-head .x{background:transparent;font-size:20px;line-height:1;padding:2px 8px;}
  .modal-body{padding:12px;}
  .modal-body video{max-width:100%;max-height:75vh;display:block;margin:0 auto;background:#000;}
  .modal-body img{max-width:100%;max-height:75vh;display:block;margin:0 auto;}
  .notice{text-align:center;color:#ffb74d;padding:14px;font-size:13px;}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .clock{width:100%;margin-left:0;}
    .time{display:none;}
    .time-short{display:inline;margin-left:auto;font-size:11px;color:var(--muted);}
    .modal-box{width:94vw;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<header>
  <h1>🏠 NAS 智慧家视觉检测事件监控大屏</h1>
  <div class="stats" id="stats">
    <div class="stat"><b id="s-total">0</b>总事件</div>
    <div class="stat"><b id="s-person">0</b>人物</div>
    <div class="stat"><b id="s-cat">0</b>猫咪</div>
    <div class="stat"><b id="s-dog">0</b>狗狗</div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="actions">
    <button class="primary" id="btn-refresh">手动刷新</button>
    <button id="btn-clear">清空筛选</button>
    <button class="toggle on" id="btn-auto">自动刷新: 30s</button>
    <button id="btn-noobj">📹 无对象视频</button>
    <button id="btn-config">⚙ 配置</button>
  </div>
</header>

<div class="filters">
  <div class="multi-select" id="ms-obj" data-f="obj">
    <div class="ms-display">
      <span class="ms-label">对象</span>
      <span class="ms-selected">全部</span>
      <span class="ms-arrow">▾</span>
    </div>
    <div class="ms-dropdown">
      <label class="ms-option ms-all"><input type="checkbox" value="all" checked> <span>全部</span></label>
      <label class="ms-option"><input type="checkbox" value="person"> <span>人物</span></label>
      <label class="ms-option"><input type="checkbox" value="cat"> <span>猫咪</span></label>
      <label class="ms-option"><input type="checkbox" value="dog"> <span>狗狗</span></label>
      <label class="ms-option"><input type="checkbox" value="horse"> <span>马</span></label>
      <label class="ms-option"><input type="checkbox" value="bird"> <span>鸡鸭</span></label>
      <label class="ms-option"><input type="checkbox" value="sheep"> <span>羊</span></label>
      <label class="ms-option"><input type="checkbox" value="cow"> <span>牛</span></label>
    </div>
  </div>
  <div class="multi-select" id="ms-pose" data-f="pose">
    <div class="ms-display">
      <span class="ms-label">姿态</span>
      <span class="ms-selected">全部姿态</span>
      <span class="ms-arrow">▾</span>
    </div>
    <div class="ms-dropdown">
      <label class="ms-option ms-all"><input type="checkbox" value="all" checked> <span>全部姿态</span></label>
      <label class="ms-option"><input type="checkbox" value="lie"> <span>躺</span></label>
      <label class="ms-option"><input type="checkbox" value="stand"> <span>站立</span></label>
      <label class="ms-option"><input type="checkbox" value="sit"> <span>坐下</span></label>
      <label class="ms-option"><input type="checkbox" value="squat"> <span>蹲下</span></label>
      <label class="ms-option"><input type="checkbox" value="bend"> <span>弯腰</span></label>
      <label class="ms-option"><input type="checkbox" value="unknown"> <span>未知</span></label>
      <label class="ms-option"><input type="checkbox" value="none"> <span>无姿态</span></label>
    </div>
  </div>
  <div class="single-select" id="ss-time" data-f="time">
    <div class="ms-display">
      <span class="ms-label">时间</span>
      <span class="ms-selected">全部</span>
      <span class="ms-arrow">▾</span>
    </div>
    <div class="ms-dropdown">
      <div class="ms-option ms-single active" data-v="all">全部</div>
      <div class="ms-option ms-single" data-v="1">近1h</div>
      <div class="ms-option ms-single" data-v="6">近6h</div>
      <div class="ms-option ms-single" data-v="24">近24h</div>
      <div class="ms-option ms-single" data-v="72">近3天</div>
      <div class="ms-option ms-single" data-v="168">近7天</div>
      <div class="ms-option ms-single" data-v="720">近30天</div>
    </div>
  </div>
  <div class="single-select" id="ss-grid" data-f="grid">
    <div class="ms-display">
      <span class="ms-label">布局</span>
      <span class="ms-selected">4x5 (20张)</span>
      <span class="ms-arrow">▾</span>
    </div>
    <div class="ms-dropdown">
      <div class="ms-option ms-single" data-v="1x1">1x1 (1张)</div>
      <div class="ms-option ms-single" data-v="2x2">2x2 (4张)</div>
      <div class="ms-option ms-single" data-v="3x3">3x3 (9张)</div>
      <div class="ms-option ms-single" data-v="3x4">3x4 (12张)</div>
      <div class="ms-option ms-single" data-v="4x4">4x4 (16张)</div>
      <div class="ms-option ms-single active" data-v="4x5">4x5 (20张)</div>
      <div class="ms-option ms-single" data-v="5x5">5x5 (25张)</div>
      <div class="ms-option ms-single" data-v="5x6">5x6 (30张)</div>
      <div class="ms-option ms-single" data-v="6x6">6x6 (36张)</div>
    </div>
  </div>
  <div class="single-select" id="ss-interval" data-f="interval">
    <div class="ms-display">
      <span class="ms-label">间隔</span>
      <span class="ms-selected">5秒</span>
      <span class="ms-arrow">▾</span>
    </div>
    <div class="ms-dropdown">
      <div class="ms-option ms-single" data-v="2">2秒</div>
      <div class="ms-option ms-single" data-v="3">3秒</div>
      <div class="ms-option ms-single active" data-v="5">5秒</div>
      <div class="ms-option ms-single" data-v="8">8秒</div>
      <div class="ms-option ms-single" data-v="10">10秒</div>
      <div class="ms-option ms-single" data-v="15">15秒</div>
      <div class="ms-option ms-single" data-v="30">30秒</div>
    </div>
  </div>
</div>

<main>
  <div class="empty" id="empty" style="display:none">暂无事件数据</div>
  <div class="slideshow" id="slideshow">
    <div class="ss-stage" id="ss-stage"></div>
    <div class="ss-bar">
      <span class="ss-counter" id="ss-counter"></span>
      <span class="lbl">布局</span>
      <select id="ss-grid-2">
        <option value="1x1">1x1 (1张)</option>
        <option value="2x2">2x2 (4张)</option>
        <option value="3x3">3x3 (9张)</option>
        <option value="3x4">3x4 (12张)</option>
        <option value="4x4">4x4 (16张)</option>
        <option value="4x5" selected>4x5 (20张)</option>
        <option value="5x5">5x5 (25张)</option>
        <option value="5x6">5x6 (30张)</option>
        <option value="6x6">6x6 (36张)</option>
      </select>
      <span class="lbl">间隔</span>
      <select id="ss-interval-2">
        <option value="2">2秒</option>
        <option value="3">3秒</option>
        <option value="5" selected>5秒</option>
        <option value="8">8秒</option>
        <option value="10">10秒</option>
        <option value="15">15秒</option>
        <option value="30">30秒</option>
      </select>
      <button id="ss-prev">◀ 上一组</button>
      <button id="ss-pause">⏸ 暂停</button>
      <button id="ss-next">下一组 ▶</button>
    </div>
    <div class="ss-progress"><div class="ss-progress-bar" id="ss-progress-bar"></div></div>
  </div>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-mask" id="m-mask"></div>
  <div class="modal-box">
    <div class="modal-head"><span id="m-title"></span><button class="x" id="m-close">×</button></div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<!-- 无对象视频弹窗 -->
<div class="modal hidden" id="noobj-modal">
  <div class="modal-mask" id="noobj-mask"></div>
  <div class="modal-box" style="width:1100px;max-width:95vw;">
    <div class="modal-head">
      <span>📹 无对象视频管理</span>
      <button class="x" id="noobj-close">×</button>
    </div>
    <div class="modal-body" id="noobj-body" style="padding:16px;max-height:78vh;overflow:auto;">
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
        <button class="ghost" id="noobj-refresh">刷新列表</button>
        <button class="ghost" id="noobj-selectall">全选</button>
        <button class="primary" id="noobj-delete" style="background:#e74c3c;">删除选中</button>
        <span id="noobj-count" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <div id="noobj-list"></div>
    </div>
  </div>
</div>

<!-- 视频播放弹窗 -->
<div class="modal hidden" id="video-modal">
  <div class="modal-mask" id="video-mask"></div>
  <div class="modal-box" style="width:900px;max-width:95vw;">
    <div class="modal-head"><span id="video-title">播放</span><button class="x" id="video-close">×</button></div>
    <div class="modal-body" style="padding:0;background:#000;">
      <video id="video-player" controls style="width:100%;max-height:78vh;display:block;"></video>
    </div>
  </div>
</div>

<div class="modal hidden" id="cfg-modal">
  <div class="modal-mask" id="cfg-mask"></div>
  <div class="modal-box" style="width:1100px;max-width:95vw;">
    <div class="modal-head"><span>⚙ 配置 / 运行</span><button class="x" id="cfg-close">×</button></div>
    <div class="modal-body" style="padding:0;">
      <iframe id="cfg-frame" src="" style="width:100%;height:78vh;border:0;background:#0f1115;"></iframe>
    </div>
  </div>
</div>

<script>
const OBJ = {
  person:{t:"人物",c:"obj-person"}, cat:{t:"猫咪",c:"obj-cat"},
  dog:{t:"狗狗",c:"obj-dog"}, horse:{t:"马",c:"obj-horse"},
  bird:{t:"鸡鸭",c:"obj-bird"}, sheep:{t:"羊",c:"obj-sheep"},
  cow:{t:"牛",c:"obj-cow"}, unknown:{t:"未知",c:"obj-unknown"}
};
const POSE = {
  // 兼容旧数据：fall → lie
  lie:{t:"躺",c:"pose-lie"}, fall:{t:"躺",c:"pose-lie"},
  stand:{t:"站立",c:"pose-stand"},
  sit:{t:"坐下",c:"pose-sit"}, squat:{t:"蹲下",c:"pose-squat"},
  bend:{t:"弯腰",c:"pose-bend"},
  unknown:{t:"未知",c:"pose-unknown"}, none:{t:"无姿态",c:"pose-none"}
};

let ALL = [];          // current events from server
// obj/pose 用 Set 支持多选；time 仍为单值
const filter = {obj:new Set(["all"]), pose:new Set(["all"]), time:"all"};
let autoRefresh = true;
let autoTimer = null;

// 轮播状态（首页唯一展示方式）
let ssInterval = 5;          // 轮播间隔（秒）
let ssGrid = "4x5";          // 轮播布局 "RxC"，默认 4x5
let ssIndex = 0;             // 轮播当前索引
let ssPaused = false;
let ssTimer = null;
let ssProgressTimer = null;

const $ = id => document.getElementById(id);

// 解析 "RxC" -> {rows, cols, perPage}
function parseGrid(g){
  const [r, c] = g.split("x").map(Number);
  return {rows: r, cols: c, perPage: r * c};
}

function tag(cls, text){ return `<span class="tag ${cls}">${text}</span>`; }

function applyFilter(list){
  const now = Math.floor(Date.now() / 1000);  // 当前 Unix 时间戳（秒）
  // 旧数据归一化：fall → lie
  const normPose = p => (p === "fall") ? "lie" : p;
  const filtered = list.filter(e=>{
    // 多选：未选"全部"时，对象类型需在选中集合内
    if(!filter.obj.has("all") && !filter.obj.has(e.objType)) return false;
    if(!filter.pose.has("all") && !filter.pose.has(normPose(e.poseType))) return false;
    if(filter.time!=="all"){
      // 用服务器返回的 ts（Unix 秒），避免时区偏差
      const t = e.ts || 0;
      if(!t || now - t > filter.time*3600) return false;
    }
    return true;
  });
  // 按时间倒序：最新的（ts 最大）排在前面
  filtered.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  return filtered;
}

// 展示图片最大值：防止事件过多导致大屏卡顿，仅展示最新 MAX_DISPLAY 张
const MAX_DISPLAY = 360;
let _totalFiltered = 0;  // 筛选后真实总数（未截断），用于计数器显示

// 返回经过筛选+上限截断后的展示列表（按时间倒序，最新在前）
function getDisplayList(){
  const filtered = applyFilter(ALL);
  _totalFiltered = filtered.length;
  return filtered.length > MAX_DISPLAY ? filtered.slice(0, MAX_DISPLAY) : filtered;
}

// 轮播单元 HTML：卡片样式（水印标签 + 日期），文字背景加深
function cellHtml(e){
  const o = OBJ[e.objType]||OBJ.unknown;
  const p = POSE[e.poseType]||POSE.unknown;
  const img = e.jpg ? `/snap/${e.jpg}` : "";
  return `<div class="ss-cell" data-jpg="${e.jpg||""}"
               data-source="${e.sourceVideo||""}"
               data-start="${e.startTime||0}"
               data-time="${e.timeFull}" data-obj="${o.t}" data-pose="${p.t}">
    <img loading="lazy" src="${img}" alt="">
    <div class="wm-date">${e.timeShort}</div>
    <div class="wm-tags">${tag(o.c,o.t)} ${tag(p.c,p.t)}</div>
  </div>`;
}

function renderSlideshow(filtered){
  if(filtered.length === 0){
    $("ss-stage").innerHTML = '<div style="color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;height:100%;">暂无事件</div>';
    $("ss-counter").textContent = "";
    return;
  }
  const g = parseGrid(ssGrid);
  const perPage = g.perPage;
  const pages = Math.ceil(filtered.length / perPage);
  if(ssIndex >= pages) ssIndex = 0;
  const start = ssIndex * perPage;
  const slice = filtered.slice(start, start + perPage);

  // 设置 stage 网格（行x列）
  const stage = $("ss-stage");
  stage.style.gridTemplateColumns = `repeat(${g.cols}, 1fr)`;
  stage.style.gridTemplateRows = `repeat(${g.rows}, 1fr)`;
  stage.innerHTML = slice.map(cellHtml).join("");

  const more = _totalFiltered > filtered.length;
  $("ss-counter").textContent = `第 ${ssIndex+1}/${pages} 页（共 ${_totalFiltered} 个事件${more ? `，仅展示最新 ${filtered.length}` : ""}，每页 ${perPage} 张）`;
}

function render(){
  const filtered = getDisplayList();
  $("empty").style.display = filtered.length===0 ? "flex" : "none";
  // 仅渲染轮播（已移除网格/时间线模式）
  renderSlideshow(filtered);
  startSlideshow();
}

// ---------- 轮播控制 ----------
function startSlideshow(){
  stopSlideshow();
  if(ssPaused) return;
  let elapsed = 0;
  const bar = $("ss-progress-bar");
  bar.style.width = "0%";
  ssProgressTimer = setInterval(()=>{
    elapsed += 0.1;
    const pct = (elapsed / ssInterval) * 100;
    bar.style.width = Math.min(pct, 100) + "%";
  }, 100);
  ssTimer = setTimeout(()=>{
    nextSlide();
  }, ssInterval * 1000);
}

function stopSlideshow(){
  if(ssTimer){ clearTimeout(ssTimer); ssTimer = null; }
  if(ssProgressTimer){ clearInterval(ssProgressTimer); ssProgressTimer = null; }
}

function nextSlide(){
  const filtered = getDisplayList();
  const g = parseGrid(ssGrid);
  const pages = Math.ceil(filtered.length / g.perPage);
  if(pages === 0) return;
  ssIndex = (ssIndex + 1) % pages;
  renderSlideshow(filtered);
  startSlideshow();
}

function prevSlide(){
  const filtered = getDisplayList();
  const g = parseGrid(ssGrid);
  const pages = Math.ceil(filtered.length / g.perPage);
  if(pages === 0) return;
  ssIndex = (ssIndex - 1 + pages) % pages;
  renderSlideshow(filtered);
  startSlideshow();
}

function loadData(){
  fetch("/api/events").then(r=>r.json()).then(j=>{
    ALL = j.events||[];
    const s = j.stats||{total:0,person:0,cat:0,dog:0};
    $("s-total").textContent=s.total;
    $("s-person").textContent=s.person;
    $("s-cat").textContent=s.cat;
    $("s-dog").textContent=s.dog;
    render();
    // pipeline 运行完会产生新事件 → 事件总数增加 → 自动截图大屏
    // 首次加载（_lastEventCount=-1）不截图，避免页面刚打开就截
    if(_lastEventCount >= 0 && s.total > _lastEventCount){
      console.log(`[screenshot] 检测到新事件 ${_lastEventCount}→${s.total}，2秒后自动截图`);
      setTimeout(captureDashboard, 2000);  // 等 2 秒让轮播渲染完图片
    }
    _lastEventCount = s.total;
  }).catch(()=>{});
}

// ---- 多选下拉框（对象/姿态）----
// 更新显示框文案：选了哪些
function updateMSDisplay(ms){
  const f = ms.dataset.f;
  const sel = filter[f];
  const display = ms.querySelector(".ms-selected");
  const allLabel = ms.querySelector(".ms-all span").textContent;
  if(sel.has("all")){
    display.textContent = allLabel;
    return;
  }
  const names = Array.from(sel).map(v=>{
    const opt = ms.querySelector(`input[value="${v}"]`);
    return opt ? opt.nextElementSibling.textContent : v;
  });
  if(names.length === 0){
    display.textContent = allLabel;
  } else if(names.length <= 2){
    display.textContent = names.join("、");
  } else {
    display.textContent = `已选 ${names.length} 项`;
  }
}

// 切换下拉框开合（同时关闭其他下拉）
function toggleMS(id){
  const ms = $(id);
  const isOpen = ms.classList.contains("open");
  document.querySelectorAll(".multi-select.open").forEach(m=>m.classList.remove("open"));
  if(!isOpen) ms.classList.add("open");
}

// 绑定两个多选下拉
document.querySelectorAll(".multi-select").forEach(ms=>{
  // 点击显示框切换开合
  ms.querySelector(".ms-display").addEventListener("click", ()=>toggleMS(ms.id));
  // 选项 checkbox 变化
  ms.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const f = ms.dataset.f;
      const sel = filter[f];
      const val = cb.value;
      if(val === "all"){
        // 选"全部" → 清空其他
        sel.clear();
        sel.add("all");
        ms.querySelectorAll('input[type=checkbox]').forEach(c=>{
          c.checked = (c.value === "all");
        });
      } else {
        sel.delete("all");
        ms.querySelector('input[value="all"]').checked = false;
        if(cb.checked) sel.add(val);
        else sel.delete(val);
        // 全部取消后自动回到"全部"，避免空集
        if(sel.size === 0){
          sel.add("all");
          ms.querySelector('input[value="all"]').checked = true;
        }
      }
      updateMSDisplay(ms);
      render();
    });
  });
  updateMSDisplay(ms);
});

// 点击下拉框外部关闭（同时处理多选和单选）
document.addEventListener("click", e=>{
  if(!e.target.closest(".multi-select") && !e.target.closest(".single-select")){

  document.querySelectorAll(".multi-select").forEach(ms=>{
    ms.querySelectorAll('input[type=checkbox]').forEach(c=>{
      c.checked = (c.value === "all");

});

// ---- 通用单选下拉框初始化 ----
// 为任意 .single-select 绑定开合 + 选项点击，回调返回选中值
function initSingleSelect(id, onChange){
  const ss = $(id);
  ss.querySelector(".ms-display").addEventListener("click", ()=>{
    const isOpen = ss.classList.contains("open");
    document.querySelectorAll(".multi-select.open,.single-select.open").forEach(m=>m.classList.remove("open"));
    if(!isOpen) ss.classList.add("open");
  });
  ss.querySelectorAll(".ms-option.ms-single").forEach(opt=>{
    opt.addEventListener("click", ()=>{
      ss.querySelectorAll(".ms-option.ms-single").forEach(x=>x.classList.remove("active"));
      opt.classList.add("active");
      ss.querySelector(".ms-selected").textContent = opt.textContent;
      ss.classList.remove("open");
      onChange(opt.dataset.v);
    });
  });
}
// 同步单个 select 的选中值（用于底部控制条）
function syncSelect(id, val){
  const sel = $(id);
  if(sel) sel.value = val;
}
// 同步单选下拉框的选中态 + 显示文案（用于底部 select 反向同步顶部下拉框）
function syncSingleSelect(id, val){
  const ss = $(id);
  if(!ss) return;
  ss.querySelectorAll(".ms-option.ms-single").forEach(x=>{
    x.classList.toggle("active", x.dataset.v === val);
  });
  const cur = ss.querySelector(".ms-option.ms-single.active");
  ss.querySelector(".ms-selected").textContent = cur ? cur.textContent : "";
}

// ---- 时间筛选（单选下拉框）----

// ---- 轮播配置（顶部单选下拉框 + 底部原生 select 双向同步）----

initSingleSelect("ss-interval", v=>{

// ---- modal ----
function openModal(card){
  const jpg = card.dataset.jpg;
  const sourceVideo = card.dataset.source;
  const startTime = parseFloat(card.dataset.start || 0);
  const title = `${card.dataset.time} ｜【${card.dataset.obj}】【${card.dataset.pose}】`;
  $("m-title").textContent = title;
  const body = $("m-body");
  if(sourceVideo){
    // 直接用 HTML5 video 播放源视频，无需插件。监听 loadedmetadata 后定位到起始时间。
    // 如果源视频不存在或不可访问（/source 返回 403/404），降级为显示 JPG 快照。
    const url = `/source?path=${encodeURIComponent(sourceVideo)}`;
    const fallbackHtml = jpg
      ? `<img src="/snap/${jpg}"><div class="notice">⚠️ 源视频不可访问，仅展示抓拍图片</div>`
      : `<div class="notice">⚠️ 源视频不可访问，且无快照图片</div>`;
    body.innerHTML =
      `<video controls autoplay preload="metadata" src="${url}"></video>` +
      `<div class="notice">⏱ 已定位到源视频 ${startTime.toFixed(1)}s 处（原始素材，未裁剪）</div>`;
    const v = body.querySelector("video");
    v.addEventListener("loadedmetadata", () => {
      try { v.currentTime = startTime; } catch(e) {}
    });
    // 视频加载失败时降级为图片
    v.addEventListener("error", () => {
      body.innerHTML = fallbackHtml;
    });
  }else if(jpg){
    body.innerHTML = `<img src="/snap/${jpg}"><div class="notice">⚠️ 该事件未记录源视频信息，仅展示抓拍图片</div>`;
  }else{
    body.innerHTML = `<div class="notice">无可用素材</div>`;
  }
  $("modal").classList.remove("hidden");
}
function closeModal(){
  const body=$("m-body");
  body.innerHTML=""; // release video/src to avoid memory leak
  $("modal").classList.add("hidden");
}

// ---------- 自动截图大屏（pipeline 运行完产生新事件后自动触发） ----------
let _lastEventCount = -1;   // 上次已知事件总数，-1 表示首次加载
let _capturing = false;     // 防止并发截图

async function captureDashboard(){
  if(_capturing) return;
  _capturing = true;
  try{
    // 截取整个展示大屏页面（顶部栏 + 轮播），保持当前全屏状态
    // 临时显示底部控制条以便截到完整 UI
    const bar = $("slideshow").querySelector(".ss-bar");
    const wasHidden = bar && getComputedStyle(bar).opacity === "0";
    if(bar && wasHidden) bar.style.opacity = "1";

    const canvas = await html2canvas(document.body, {
      backgroundColor: "#0f1115",
      scale: 1,
      logging: false,
      useCORS: true,
    });
    // 恢复控制条隐藏状态
    if(bar && wasHidden) bar.style.opacity = "";

    // 转为 blob 上传到后端
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
    const fd = new FormData();
    fd.append("file", blob, "grid_latest.jpg");
    const r = await fetch("/api/grid_upload", {method:"POST", body:fd});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "upload failed");
    console.log("[screenshot] 自动截图已保存:", j.updated);
  } catch(e){
    console.error("[screenshot] 自动截图失败:", e);
  } finally {
    _capturing = false;
  }
}

function enterKiosk(){

  try{ document.documentElement.requestFullscreen?.(); }catch(e){}
  // 全屏模式下隐藏筛选条/配置栏/退出按钮，只保留顶部栏 + 轮播（由 CSS 控制）
  render();
}

function exitKiosk(){
  document.body.classList.remove('kiosk');
  try{ document.exitFullscreen?.(); }catch(e){}
  resetIdleTimer();
}

function resetIdleTimer(){
  if(_idleTimer) clearTimeout(_idleTimer);
  _idleTimer = setTimeout(enterKiosk, KIOSK_DELAY);
}

// 监听用户操作（鼠标移动、点击、键盘、滚动、触摸）
['mousemove','click','keydown','scroll','touchstart'].forEach(ev=>{
  window.addEventListener(ev, ()=>{
    if(document.body.classList.contains('kiosk')){
      // 全屏模式下任意操作退出全屏
      exitKiosk();
    } else {
      resetIdleTimer();
    }
  }, {passive:true});
});

// 启动倒计时
resetIdleTimer();
</script>
</body>
</html>
