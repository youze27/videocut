<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videocut 配置</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e6e6e6; --muted:#9aa0aa;
          --accent:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; --line:#2a2f3a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:12px 20px; background:var(--card); display:flex;
           align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  .badge { font-size:12px; padding:3px 8px; border-radius:10px;
           background:#2a2f3a; color:var(--muted); }
  .badge.run { background:rgba(79,140,255,.2); color:var(--accent); }

  /* 紧凑布局：卡片网格 */
  main { padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card { background:var(--card); border-radius:10px; padding:14px; }
  .card.full { grid-column:1 / -1; }   /* 跨两列 */
  .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
                   color:var(--accent); margin:0 0 10px; font-weight:600;
                   border-bottom:1px solid var(--line); padding-bottom:6px; }

  /* 表单元素紧凑化 */
  label { display:block; font-size:11px; color:var(--muted); margin:6px 0 3px; }
  input, select { width:100%; padding:6px 8px; border-radius:5px; border:1px solid var(--line);
                  background:#0f1115; color:var(--fg); font-size:12px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .row.tight { gap:6px; }

  button { cursor:pointer; border:none; border-radius:5px; padding:7px 12px;
           font-size:12px; font-weight:600; }
  .primary { background:var(--accent); color:#fff; }
  .primary:hover { background:#3a7ae8; }
  .ghost { background:#2a2f3a; color:var(--fg); }
  .ghost:hover { background:#343a48; }
  .danger { color:#e74c3c; border:1px solid #e74c3c; background:transparent; }

  /* 配置组内联布局：两项一行 */
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

  .hint { font-size:11px; color:var(--muted); padding:5px 8px;
          background:#0b0d11; border-radius:5px; margin:4px 0; line-height:1.4; }

  /* 操作按钮栏 */
  .actions-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .actions-bar .scan-stat { font-size:11px; color:var(--muted); margin-left:auto; }

  /* 进度条 */
  .pbar-wrap { background:#0b0d11; border-radius:6px; height:22px; overflow:hidden;
               position:relative; margin:4px 0; }
  .pbar-fill { height:100%; background:linear-gradient(90deg,#4f8cff,#3ecf8e);
               transition:width .4s ease; width:0%; }
  .pbar-text { position:absolute; inset:0; display:flex; align-items:center;
               justify-content:center; font-size:11px; color:#fff; font-weight:600; }
  .stage-tag { font-size:11px; padding:2px 8px; border-radius:8px; margin-right:6px; }
  .st-scan    { background:rgba(79,140,255,.2); color:var(--accent); }
  .st-extract,.st-extract_done { background:rgba(255,193,7,.2); color:#ffc107; }
  .st-detect,.st-detect_done  { background:rgba(156,89,255,.2); color:#9c59ff; }
  .st-pose    { background:rgba(233,30,99,.2); color:#ec407a; }
  .st-snapshot{ background:rgba(62,207,142,.2); color:var(--ok); }
  .st-video   { background:rgba(0,188,212,.2); color:#00bcd4; }
  .st-done    { background:rgba(62,207,142,.2); color:var(--ok); }
  .st-error   { background:rgba(255,107,107,.2); color:var(--bad); }
  .st-idle    { background:#2a2f3a; color:var(--muted); }

  /* 详细进度项 */
  .dp-item { background:#0b0d11; border-radius:6px; padding:8px 10px; }
  .dp-item .dp-label { font-size:10px; color:var(--muted); text-transform:uppercase;
                       letter-spacing:.04em; margin-bottom:2px; }
  .dp-item .dp-value { font-size:13px; color:var(--fg); font-weight:600; }
  .dp-item .dp-sub { font-size:11px; color:var(--muted); margin-top:2px; }

  /* 摘要卡片网格 */
  .summary-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .sum-item { background:#0b0d11; border-radius:6px; padding:8px; font-size:12px; }
  .sum-total { background:rgba(79,140,255,.1); display:flex; justify-content:space-around;
               font-weight:600; padding:8px; border-radius:6px; font-size:12px; }

  /* 日志区 */
  pre.log { background:#0b0d11; border-radius:8px; padding:10px; height:240px;
            overflow:auto; font-size:11px; line-height:1.45; color:#cfe3ff;
            white-space:pre-wrap; margin:0; }

  /* 任务历史：紧凑表格 */
  .task-table { width:100%; border-collapse:collapse; font-size:11px; }
  .task-table th, .task-table td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
  .task-table th { color:var(--muted); font-weight:600; }
  .task-table tr { cursor:pointer; }
  .task-table tr:hover { background:#1d2230; }
  .task-table tr.active { background:rgba(79,140,255,.15); }
  .status { font-size:10px; padding:2px 6px; border-radius:8px; }
  .s-done { background:rgba(62,207,142,.18); color:var(--ok); }
  .s-running,.s-queued { background:rgba(79,140,255,.18); color:var(--accent); }
  .s-failed { background:rgba(255,107,107,.18); color:var(--bad); }
  .s-cancelled { background:rgba(154,160,170,.18); color:var(--muted); }
  .s-killed { background:rgba(255,107,107,.22); color:#ff8c8c; }
  .s-timeout { background:rgba(255,152,0,.2); color:#ffa726; }

  /* 目录浏览 */
  .browse { font-size:11px; color:var(--accent); cursor:pointer; user-select:none; margin-top:2px; display:inline-block; }
  .dirlist { max-height:120px; overflow:auto; background:#0b0d11; border-radius:5px;
             padding:4px; font-size:11px; display:none; margin-top:2px; }
  .dirlist div { padding:2px 5px; cursor:pointer; border-radius:3px; }
  .dirlist div:hover { background:#1d2230; }

  /* 输入源条目 */
  .is-item { background:#0b0d11; border-radius:6px; padding:8px; margin-bottom:6px; }

  a { color:var(--accent); }
  code { background:#0b0d11; padding:1px 5px; border-radius:3px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>videocut 配置</h1>
  <span id="runbadge" class="badge">idle</span>
  <span class="badge">输出: <span id="outdir"></span></span>
  <a class="badge" href="/" target="_top" style="text-decoration:none;">监控事件大屏 →</a>
</header>

<main>
  <!-- ===== 输入输出 ===== -->
  <div class="card">
    <p class="section-title">📁 输入输出</p>
    <label>输入源（每个摄像头独立配置路径与品牌）</label>
    <div id="input_sources_container"></div>
    <button class="ghost" onclick="addInputSource()" style="margin-top:4px;padding:5px 10px;font-size:11px;">+ 添加摄像头</button>

    <div class="grid-2" style="margin-top:8px;">
      <div>
        <label>输出文件夹</label>
        <input id="output_dir" />
        <div class="browse" onclick="toggleBrowse('output_dir')">浏览…</div>
        <div class="dirlist" id="dl_output_dir"></div>
      </div>
      <div>
        <label>工作目录（临时文件）</label>
        <input id="work_dir" />
      </div>
    </div>
  </div>

  <!-- ===== 检测参数 ===== -->
  <div class="card">
    <p class="section-title">🎯 检测参数</p>
    <div class="grid-3">
      <div>
        <label>检测置信度</label>
        <input id="det_conf" type="number" step="0.05">
      </div>
      <div>
        <label>抽帧间隔(秒)</label>
        <input id="det_interval" type="number" step="0.5">
      </div>
      <div>
        <label>去重阈值</label>
        <input id="similarity_threshold" type="number">
      </div>
    </div>
    <div class="grid-2" style="margin-top:6px;">
      <div>
        <label>姿态识别(YOLOv8-pose)</label>
        <select id="use_pose">
          <option value="true">开启</option>
          <option value="false">关闭</option>
        </select>
      </div>
      <div>
        <label>线程数</label>
        <select id="worker_threads">
          <option value="auto">自动（按CPU核心）</option>
          <option value="1">1（单线程）</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>
    <div class="hint">扫描策略：用扩展名+文件名预过滤，只扫当天视频，再取最近 N 小时处理</div>
    <div class="grid-2" style="margin-top:6px;">
      <div>
        <label>只扫当天</label>
        <select id="scan_today_only">
          <option value="true">开启</option>
          <option value="false">关闭（扫全部）</option>
        </select>
      </div>
      <div>
        <label>处理最近时段</label>
        <select id="scan_process_hours">
          <option value="1">最近 1 小时</option>
          <option value="2">最近 2 小时</option>
          <option value="4">最近 4 小时</option>
          <option value="6">最近 6 小时</option>
          <option value="12">最近 12 小时</option>
          <option value="24">最近 24 小时（全天）</option>
          <option value="0">不限制（当天全部）</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ===== 自动化调度 ===== -->
  <div class="card">
    <p class="section-title">⏰ 自动化调度</p>
    <div class="grid-2">
      <div>
        <label>定时自动运行</label>
        <select id="schedule_enabled">
          <option value="true">开启</option>
          <option value="false">关闭</option>
        </select>
      </div>
      <div>
        <label>定时间隔(小时)</label>
        <input id="schedule_interval_hours" type="number" min="0.5" step="0.5">
      </div>
    </div>
    <div class="grid-2" style="margin-top:6px;">
      <div>
        <label>目录监听(新增视频自动跑)</label>
        <select id="watch_enabled">
          <option value="true">开启</option>
          <option value="false">关闭</option>
        </select>
      </div>
      <div>
        <label>监听轮询(分钟)</label>
        <input id="watch_interval" type="number" min="1">
      </div>
    </div>
    <div class="grid-3" style="margin-top:6px;">
      <div>
        <label>每日清理过期帧</label>
        <select id="cleanup_enabled">
          <option value="true">开启</option>
          <option value="false">关闭</option>
        </select>
      </div>
      <div>
        <label>清理时间</label>
        <input id="cleanup_time" type="time" />
      </div>
      <div>
        <label>帧保留天数</label>
        <input id="frame_retention_days" type="number" min="0">
      </div>
    </div>
    <div style="margin-top:6px;">
      <label>任务最长运行时长（小时，超过自动杀死，0=不限制）</label>
      <input id="max_task_hours" type="number" min="0" step="1">
    </div>
    <button class="ghost" onclick="cleanupNow()" style="margin-top:8px;padding:5px 10px;font-size:11px;">🗑 立即清理</button>
  </div>

  <!-- ===== 快照输出 ===== -->
  <div class="card">
    <p class="section-title">🖼 快照输出</p>
    <div class="grid-3">
      <div>
        <label>快照比例(宽:高)</label>
        <input id="snapshot_ratio" placeholder="3:2">
      </div>
      <div>
        <label>快照宽度(px)</label>
        <input id="snapshot_width" type="number">
      </div>
      <div>
        <label>裁剪边距</label>
        <input id="snapshot_padding" type="number" step="0.05">
      </div>
    </div>
    <div class="grid-2" style="margin-top:6px;">
      <div>
        <label>网格截图列数</label>
        <input id="grid_cols" type="number" min="1" max="12">
      </div>
      <div>
        <label>网格截图行数</label>
        <input id="grid_rows" type="number" min="1" max="12">
      </div>
    </div>
    <div class="hint">
      每次 pipeline 运行完自动生成高清网格截图（后端生成，无需浏览器开着）<br>
      固定访问：<code>http://&lt;IP&gt;:8080/api/grid_latest</code>
      <button class="ghost" onclick="window.open('/api/grid_latest','_blank')"
              style="margin-left:6px;padding:3px 8px;font-size:10px;">查看</button>
    </div>
  </div>

  <!-- ===== 操作按钮（跨两列） ===== -->
  <div class="card full">
    <div class="actions-bar">
      <button class="primary" onclick="saveConfig()">💾 保存配置</button>
      <button class="ghost" onclick="runNow()" id="btnRun">▶ 立即运行</button>
      <button class="ghost" onclick="cancelRun()" id="btnCancel" style="display:none;">⏸ 停止(软)</button>
      <button class="danger" onclick="killRun()" id="btnKill" style="display:none;">⏹ 杀死(强制)</button>
      <button class="ghost" onclick="scanVideos()">🔍 扫描测试</button>
      <span id="runelapsed" class="scan-stat" style="color:var(--accent);font-weight:600;"></span>
      <span id="scanstat" class="scan-stat"></span>
    </div>
    <div id="scanresult" style="margin-top:8px;max-height:180px;overflow:auto;font-size:11px;display:none;"></div>
  </div>

  <!-- ===== 运行进度 + 摘要（跨两列） ===== -->
  <div class="card full">
    <p class="section-title">📊 运行进度</p>
    <!-- 总进度条 -->
    <div class="pbar-wrap">
      <div class="pbar-fill" id="pbar_fill"></div>
      <div class="pbar-text" id="pbar_text">空闲</div>
    </div>
    <div id="stage_detail" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>

    <!-- 分阶段详细进度（运行中显示） -->
    <div id="detail_progress" style="margin-top:10px;display:none;">
      <div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:6px;
                  text-transform:uppercase;letter-spacing:.04em;">详细进度</div>
      <div id="detail_grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;"></div>
    </div>

    <div id="summary_area" style="margin-top:10px;"></div>
  </div>

  <!-- ===== 实时日志 + 任务历史（跨两列） ===== -->
  <div class="card full">
    <p class="section-title">📋 实时日志</p>
    <pre class="log" id="log">—</pre>
  </div>

  <!-- ===== 任务历史（跨两列，紧凑表格） ===== -->
  <div class="card full">
    <p class="section-title">📜 任务历史 <span style="font-size:11px;color:var(--muted);font-weight:normal;text-transform:none;letter-spacing:0;">（点击行查看详情与输出）</span></p>
    <div style="max-height:240px;overflow:auto;">
      <table class="task-table">
        <thead>
          <tr><th>任务ID</th><th>状态</th><th>开始</th><th>完成</th><th>用时</th><th>快照</th></tr>
        </thead>
        <tbody id="task_tbody"></tbody>
      </table>
    </div>
    <div id="task_detail" style="font-size:12px;color:var(--muted);margin-top:10px;display:none;"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let _inputSources = []; // [{path, brand}]
let _currentTaskId = null;  // 用户选中的任务（非运行时查看历史用）

// 秒数格式化为 "1h23m" / "5m20s" / "12s"
function fmtDuration(sec){
  if (sec == null || isNaN(sec)) return '-';
  sec = Math.floor(sec);
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + 'm' + s + 's';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + 'h' + mm + 'm';
}
// 从任务记录计算用时（秒）。running 时用后端 elapsed，否则从 started/finished 解析。
function calcDuration(t, elapsed){
  if (elapsed != null) return fmtDuration(elapsed);
  if (!t.started) return '-';
  const s = Date.parse(t.started.replace(' ', 'T'));
  const e = t.finished ? Date.parse(t.finished.replace(' ', 'T')) : Date.now();
  if (isNaN(s) || isNaN(e)) return '-';
  return fmtDuration((e - s) / 1000);
}

// 渲染详细进度网格：根据当前 stage 和 extra 展示分阶段细粒度进度
function renderDetailProgress(p, running){
  const box = $('detail_progress');
  const grid = $('detail_grid');
  const stage = p.stage || 'idle';
  const extra = p.extra || {};

  // 空闲/完成/出错时不显示详细网格
  if (!running || stage === 'idle' || stage === 'done' || stage === 'error') {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';

  // 构建进度项列表（label, value, sub）
  const items = [];
  // 视频进度（大部分阶段都有 video 信息）
  if (extra.video) {
    if (stage === 'video') {
      items.push(['视频进度', `${extra.video_idx}/${extra.video_total}`,
                  extra.duration ? `时长 ${extra.duration}s` : '']);
    } else {
      items.push(['当前视频', extra.video, '']);
    }
  }
  // 抽帧阶段
  if (stage === 'extract') {
    items.push(['抽帧状态', '进行中',
                `预计 ${p.total} 帧 · 间隔 ${extra.interval||'-'}s`]);
  }
  if (stage === 'extract_done') {
    items.push(['抽帧结果', `${p.current} 帧`, '']);
  }
  // 识别阶段
  if (stage === 'detect') {
    items.push(['识别进度', `${p.current}/${p.total} 帧`,
                extra.detected_so_far != null ? `已检出 ${extra.detected_so_far} 帧` : '']);
    if (extra.frame) items.push(['当前帧', extra.frame,
                                  extra.result ? `结果: ${extra.result}` : '']);
  }
  if (stage === 'detect_done') {
    items.push(['识别结果', `${extra.frames_detected||p.current}/${extra.frames_total||p.total} 帧有对象`, '']);
  }
  // 姿态识别阶段
  if (stage === 'pose') {
    const phaseTxt = {pose_inference:'姿态推理中', crop_retry:'裁剪重试中',
                      pose_retry_start:'姿态重试启动',
                      pose_retry_done:'姿态重试成功'}[extra.phase] || '处理中';
    items.push(['姿态阶段', phaseTxt,
                extra.frame ? `帧: ${extra.frame}` : '']);
    if (extra.pose) items.push(['识别姿态', extra.pose, '']);
    if (extra.retry_frames) items.push(['重试帧数', `${extra.retry_frames} 帧`, '']);
    if (extra.retry_idx != null) items.push(['重试进度', `${extra.retry_idx}/${extra.retry_total}`, '']);
    if (extra.frame_time != null) items.push(['视频时间', `${extra.frame_time}s`, '']);
  }
  // 快照阶段
  if (stage === 'snapshot') {
    items.push(['快照序号', `第 ${p.current} 张`, '']);
    if (extra.obj) items.push(['对象/姿态', `${extra.obj}/${extra.pose||'-'}`, '']);
    if (extra.frame_time != null) items.push(['视频时间', `${extra.frame_time}s`, '']);
  }

  // 兜底：如果没有匹配项，至少显示 stage text
  if (items.length === 0 && p.text) {
    items.push(['当前状态', p.text, '']);
  }

  grid.innerHTML = items.map(([lbl, val, sub]) =>
    `<div class="dp-item">
       <div class="dp-label">${lbl}</div>
       <div class="dp-value">${val}</div>
       ${sub ? `<div class="dp-sub">${sub}</div>` : ''}
     </div>`
  ).join('');
}

// ---- 输入源（多摄像头）管理 ----
function renderInputSources() {
  const container = $('input_sources_container');
  container.innerHTML = '';
  _inputSources.forEach((src, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'is-item';
    wrap.innerHTML = `
      <div class="row tight" style="align-items:flex-end;">
        <div style="flex:1;">
          <label>路径 ${i+1}</label>
          <input class="is-path" id="is_path_${i}" value="${src.path||''}" placeholder="/host/cam1"
                 oninput="updateInputSource(${i}, 'path', this.value)">
        </div>
        <div style="flex:0 0 110px;">
          <label>品牌</label>
          <select class="is-brand" onchange="updateInputSource(${i}, 'brand', this.value)">
            <option value="auto" ${src.brand==='auto'?'selected':''}>自动</option>
            <option value="xiaomi" ${src.brand==='xiaomi'?'selected':''}>小米</option>
            <option value="hikvision" ${src.brand==='hikvision'?'selected':''}>海康</option>
            <option value="dahua" ${src.brand==='dahua'?'selected':''}>大华</option>
            <option value="generic" ${src.brand==='generic'?'selected':''}>通用</option>
          </select>
        </div>
        <button class="ghost" style="flex:0 0 auto;padding:6px 9px;" title="浏览目录"
                onclick="browseInputSource(${i})">浏览</button>
        <button class="danger" style="flex:0 0 auto;padding:6px 10px;"
                onclick="removeInputSource(${i})" title="删除">×</button>
      </div>
      <div class="dirlist" id="is_dl_${i}"></div>
    `;
    container.appendChild(wrap);
  });
}

// 输入源路径浏览（逐级进入 + 选择）
async function browseInputSource(idx) {
  const dl = $('is_dl_' + idx);
  if (dl.style.display === 'block') { dl.style.display='none'; return; }
  await _renderBrowseList(idx, $('is_path_' + idx).value || '/host');
}

async function _renderBrowseList(idx, path) {
  const dl = $('is_dl_' + idx);
  dl.style.display = 'block';
  dl.innerHTML = '<div style="color:var(--muted);">加载中…</div>';
  try {
    const r = await fetch('/api/browse?path=' + encodeURIComponent(path));
    const j = await r.json();
    if (!j.exists) {
      dl.innerHTML = '<div style="color:var(--bad);">目录不存在</div>';
      return;
    }
    const enc = p => encodeURIComponent(p);
    let html = `<div style="color:var(--accent);padding:3px 5px;border-bottom:1px solid #1d2230;
                margin-bottom:2px;font-weight:600;">当前: ${j.path}</div>`;
    if (!j.is_root) {
      const norm = j.path.replace(/\\/g,'/').replace(/\/$/,'');
      const parts = norm.split('/');
      let parent;
      if (parts.length <= 1) {
        parent = '/host';
      } else {
        parent = parts.slice(0, -1).join('/') || '/';
        if (/^[A-Z]:$/i.test(parent)) parent = parent + '/';
      }
      if (parent !== j.path) {
        html += `<div class="br-item" data-p="${enc(parent)}" data-idx="${idx}"
                 style="color:var(--muted);cursor:pointer;">↩ ..</div>`;
      }
    }
    if (j.dirs.length === 0) {
      html += '<div style="color:var(--muted);">（无子目录）</div>';
    } else {
      j.dirs.forEach(d => {
        const name = d.replace(/\\/g,'/').replace(/\/$/,'').split('/').pop() || d;
        html += `<div class="br-item" data-p="${enc(d)}" data-idx="${idx}"
                 style="cursor:pointer;padding:2px 5px;">📁 ${name}</div>`;
      });
    }
    if (!j.is_root) {
      html += `<div class="br-pick" data-p="${enc(j.path)}" data-idx="${idx}"
               style="color:var(--ok);border-top:1px solid #1d2230;margin-top:2px;
               padding-top:4px;font-weight:600;cursor:pointer;">✓ 使用此目录</div>`;
    }
    dl.innerHTML = html;
    dl.querySelectorAll('.br-item').forEach(el => {
      el.addEventListener('click', () => {
        _renderBrowseList(parseInt(el.dataset.idx), decodeURIComponent(el.dataset.p));
      });
    });
    dl.querySelectorAll('.br-pick').forEach(el => {
      el.addEventListener('click', () => {
        pickInputSourceDir(parseInt(el.dataset.idx), decodeURIComponent(el.dataset.p));
      });
    });
  } catch (e) {
    dl.innerHTML = '<div style="color:var(--bad);">出错: ' + e + '</div>';
  }
}

function pickInputSourceDir(idx, d) {
  if (_inputSources[idx]) _inputSources[idx].path = d;
  const inp = $('is_path_' + idx);
  if (inp) inp.value = d;
  $('is_dl_' + idx).style.display = 'none';
}

function addInputSource() {
  _inputSources.push({path: '', brand: 'auto'});
  renderInputSources();
}

function removeInputSource(idx) {
  _inputSources.splice(idx, 1);
  renderInputSources();
}

function updateInputSource(idx, field, value) {
  if (_inputSources[idx]) _inputSources[idx][field] = value;
}

async function loadConfig() {
  const r = await fetch('/api/config'); const c = await r.json();
  _inputSources = (c.input_sources && c.input_sources.length)
    ? c.input_sources.map(s => ({path: s.path||'', brand: s.brand||'auto'}))
    : [{path: c.input_dir || '/host', brand: c.camera_brand || 'auto'}];
  renderInputSources();
  for (const k of Object.keys(c)) {
    if (k === 'input_sources' || k === 'input_dir' || k === 'camera_brand') continue;
    const el = $(k);
    if (!el) continue;
    if (k === 'schedule_enabled' || k === 'watch_enabled' ||
        k === 'cleanup_enabled' || k === 'scan_today_only') {
      el.value = c[k] ? 'true' : 'false';
    } else {
      el.value = c[k];
    }
  }
  $('outdir').textContent = c.output_dir;
}

async function saveConfig(quiet) {
  const sources = _inputSources.filter(s => s.path && s.path.trim());
  if (sources.length === 0) { alert('请至少添加一个输入文件夹'); return false; }
  const c = {input_sources: sources};
  ['output_dir','work_dir',
   'det_conf','det_interval','similarity_threshold',
   'snapshot_ratio','snapshot_width','snapshot_padding',
   'schedule_interval_hours','watch_interval',
   'worker_threads','frame_retention_days','cleanup_time',
   'grid_cols','grid_rows','max_task_hours',
   'scan_process_hours'
  ].forEach(k => { c[k] = $(k).value; });
  c.schedule_enabled = $('schedule_enabled').value === 'true';
  c.use_pose = $('use_pose').value === 'true';
  c.watch_enabled = $('watch_enabled').value === 'true';
  c.cleanup_enabled = $('cleanup_enabled').value === 'true';
  c.scan_today_only = $('scan_today_only').value === 'true';
  // scan_mode 固定 smart，date_source 固定 either，不让用户改
  c.scan_mode = 'smart';
  c.date_source = 'either';
  c.camera_brand = sources[0].brand;
  try {
    await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(c)});
  } catch (e) {
    alert('保存失败: ' + e.message);
    return false;
  }
  $('outdir').textContent = c.output_dir;
  if (!quiet) alert('已保存');
  return true;
}

async function runNow() {
  // 静默保存配置，失败则中止
  const ok = await saveConfig(true);
  if (!ok) return;
  const r = await fetch('/api/run', {method:'POST'});
  const j = await r.json();
  if (!j.ok) { alert(j.msg || '运行失败'); return; }
  $('btnRun').style.display = 'none';
  $('btnCancel').style.display = '';
  refresh();
}

async function cancelRun() {
  await fetch('/api/cancel', {method:'POST'});
  $('btnCancel').style.display = 'none';
  $('btnRun').style.display = '';
  refresh();
}

async function killRun() {
  if (!confirm('确定强制杀死当前任务？\n被杀死的任务标记为 killed，队列中的待运行任务也会被清空。')) return;
  await fetch('/api/kill', {method:'POST'});
  $('btnCancel').style.display = 'none';
  $('btnKill').style.display = 'none';
  $('btnRun').style.display = '';
  refresh();
}

async function cleanupNow() {
  const r = await fetch('/api/cleanup', {method:'POST'});
  const j = await r.json();
  if (j.ok) {
    alert('清理完成：删除 ' + (j.result.deleted || 0) + ' 个过期帧文件');
  } else {
    alert('清理失败：' + (j.msg || '未知错误'));
  }
}

async function scanVideos() {
  const sources = _inputSources.filter(s => s.path && s.path.trim());
  if (sources.length === 0) { alert('请先添加输入文件夹'); return; }
  $('scanstat').textContent = '扫描中…';
  $('scanresult').style.display = 'none';
  try {
    const results = await Promise.all(sources.map(src =>
      fetch('/api/scan?input_dir=' + encodeURIComponent(src.path) +
            '&brand=' + encodeURIComponent(src.brand || 'auto'))
        .then(r => r.json())
        .then(j => ({src, j}))
    ));
    let totalAll = 0, todayAll = 0;
    let html = '';
    results.forEach(({src, j}) => {
      if (!j.exists) {
        html += `<div style="padding:5px 8px;border-bottom:1px solid #1d2230;color:var(--bad);">` +
                `[${src.brand}] ${j.input_dir} — 目录不存在</div>`;
        return;
      }
      totalAll += j.total; todayAll += j.today;
      const brandLabel = {auto:'自动',xiaomi:'小米',hikvision:'海康',dahua:'大华',generic:'通用'}[src.brand] || src.brand;
      html += `<div style="padding:5px 8px;background:#1d2230;border-radius:4px;margin-bottom:4px;">` +
              `<b style="color:var(--accent);">${brandLabel}</b> · ${j.input_dir} ` +
              `— 共 ${j.total} 个，今天 ${j.today} 个</div>`;
      html += (j.videos||[]).map(v =>
        `<div style="padding:2px 4px 2px 14px;border-bottom:1px solid #1d2230;">` +
        `${v.name} — ${v.date || '<span style="color:var(--bad)">日期解析失败</span>'} ` +
        `${v.date_source ? '('+v.date_source+')' : ''} — ${(v.size/1048576).toFixed(1)}MB</div>`
      ).join('') || '<div style="padding:2px 4px 2px 14px;">无视频文件</div>';
    });
    $('scanstat').textContent = `共 ${sources.length} 个摄像头，总计 ${totalAll} 个视频，今天 ${todayAll} 个`;
    $('scanresult').innerHTML = html || '<div>无视频文件</div>';
    $('scanresult').style.display = 'block';
  } catch (e) {
    $('scanstat').textContent = '扫描出错: ' + e;
  }
}

async function toggleBrowse(field) {
  const dl = $('dl_' + field);
  if (dl.style.display === 'block') { dl.style.display='none'; return; }
  const cur = $(field).value || '/host';
  const r = await fetch('/api/browse?path=' + encodeURIComponent(cur));
  const j = await r.json();
  dl.innerHTML = j.dirs.map(d => `<div onclick="pickDir('${field}','${d}')">${d}</div>`).join('')
    || '<div>（无子目录）</div>';
  dl.style.display = 'block';
}
function pickDir(field, d) { $(field).value = d; $('dl_'+field).style.display='none'; }

async function refresh() {
  const r = await fetch('/api/tasks'); const j = await r.json();
  $('runbadge').textContent = j.running ? 'running' : 'idle';
  $('runbadge').className = 'badge' + (j.running ? ' run' : '');
  // 运行中显示「停止(软)」+「杀死(强制)」两个按钮
  $('btnRun').style.display = j.running ? 'none' : '';
  $('btnCancel').style.display = j.running ? '' : 'none';
  $('btnKill').style.display = j.running ? '' : 'none';
  // 运行时长显示
  if (j.running && j.elapsed != null) {
    $('runelapsed').textContent = '⏱ 已运行 ' + fmtDuration(j.elapsed);
  } else {
    $('runelapsed').textContent = '';
  }

  // 进度条 + 详细进度
  try {
    const pr = await fetch('/api/progress'); const p = await pr.json();
    const stageLabels = {scan:'扫描',video:'视频',extract:'抽帧',extract_done:'抽帧完成',
                         detect:'识别中',detect_done:'识别完成',pose:'姿态识别',
                         snapshot:'保存快照',done:'完成',error:'出错',idle:'空闲'};
    const stage = p.stage || 'idle';
    const label = stageLabels[stage] || stage;
    let pct = 0;
    if (stage === 'done') pct = 100;
    else if (stage === 'idle' || stage === 'error') pct = 0;
    else if (p.total > 0 && stage !== 'scan') pct = Math.round((p.current / p.total) * 100);
    else if (stage === 'scan') pct = 10;
    $('pbar_fill').style.width = pct + '%';
    $('pbar_text').textContent = pct + '%';
    $('stage_detail').innerHTML =
      `<span class="stage-tag st-${stage}">${label}</span>` +
      (p.text || '');

    // 渲染详细进度网格（运行中且非 idle/done 时显示）
    renderDetailProgress(p, j.running);
  } catch (e) {}

  // 运行结果摘要
  try {
    const sr = await fetch('/api/summary'); const s = await sr.json();
    const area = $('summary_area');
    if (s.summary && s.summary.length > 0) {
      let html = '<p class="section-title" style="margin:0 0 6px;">运行结果摘要</p>';
      let totalFrames = 0, totalDet = 0, totalSnap = 0;
      s.summary.forEach((v) => {
        totalFrames += v.frames_extracted || 0;
        totalDet += v.frames_detected || 0;
        totalSnap += v.snapshots || 0;
        // 跳过的视频：显示"已跳过"，不显示 0 数据误导用户
        if (v.skipped) {
          html += `<div class="sum-item" style="margin-bottom:6px;opacity:.7;">` +
                  `<div style="display:flex;justify-content:space-between;align-items:center;">` +
                  `<b style="color:var(--muted);">${v.video}</b>` +
                  `<span style="color:var(--muted);">⏭ 已跳过（已处理过）</span>` +
                  `</div></div>`;
          return;
        }
        const detColor = v.snapshots > 0 ? 'var(--ok)' : 'var(--muted)';
        const statusText = v.snapshots > 0
          ? `${v.snapshots} 张快照`
          : (v.frames_detected > 0 ? `${v.frames_detected} 帧检测到(去重)` : '无检测');
        html += `<div class="sum-item" style="margin-bottom:6px;">` +
                `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">` +
                `<b style="color:var(--accent);">${v.video}</b>` +
                `<span style="color:${detColor};font-weight:600;">${statusText}</span>` +
                `</div>` +
                `<div style="color:var(--muted);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;">` +
                `<span>时长: ${v.duration}s</span>` +
                `<span>抽帧: ${v.frames_extracted}</span>` +
                `<span>检测: ${v.frames_detected}</span>` +
                `<span>用时: ${v.elapsed}s</span>` +
                `</div>` +
                (v.date ? `<div style="color:var(--muted);font-size:11px;margin-top:2px;">📅 ${v.date}</div>` : '') +
                `</div>`;
      });
      html += `<div class="sum-total">` +
              `<span>视频: ${s.summary.length}</span>` +
              `<span>总抽帧: ${totalFrames}</span>` +
              `<span>总检测: ${totalDet}</span>` +
              `<span style="color:var(--ok);">总快照: ${totalSnap}</span>` +
              `</div>`;
      area.innerHTML = html;
    } else if (!s.running) {
      area.innerHTML = '<div style="font-size:12px;color:var(--muted);">暂无运行结果</div>';
    } else {
      area.innerHTML = '';
    }
  } catch (e) {}

  // 实时日志
  let logId = null;
  if (j.running && j.current) {
    logId = j.current;
  } else if (_currentTaskId && j.tasks.some(t => t.id === _currentTaskId)) {
    logId = _currentTaskId;  // 用户选中某个任务时显示该任务日志
  } else if (j.tasks.length > 0) {
    logId = j.tasks[j.tasks.length - 1].id;
  }
  if (logId) {
    try {
      const lr = await fetch('/api/task/' + logId);
      const lj = await lr.json();
      const txt = lj.log || '(暂无日志)';
      const el = $('log');
      if (el.textContent !== txt) {
        const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.textContent = txt;
        if (atBottom) el.scrollTop = el.scrollHeight;
      }
    } catch (e) {}
  }

  // 任务历史表格：紧凑展示所有任务
  renderTaskTable(j.tasks, j.running, j.current, j.elapsed);
}

function renderTaskTable(tasks, running, currentId, elapsed) {
  const tbody = $('task_tbody');
  const reversed = tasks.slice().reverse();  // 最新在前
  // 高亮逻辑：运行中始终高亮当前运行任务；非运行时高亮用户选中的或最新任务
  const activeId = running ? currentId
                  : (_currentTaskId && tasks.some(t => t.id === _currentTaskId)
                     ? _currentTaskId
                     : (tasks.length ? tasks[tasks.length - 1].id : null));
  tbody.innerHTML = reversed.map(t => {
    const isActive = t.id === activeId ? 'active' : '';
    const snapCount = (t.outputs || []).length;
    const dur = calcDuration(t, (running && t.id === currentId) ? elapsed : null);
    return `<tr class="${isActive}" onclick="selectTask('${t.id}')">
      <td style="font-family:monospace;font-size:10px;">${t.id}</td>
      <td><span class="status s-${t.status}">${t.status}</span></td>
      <td style="font-size:10px;">${t.started || '-'}</td>
      <td style="font-size:10px;">${t.finished || '-'}</td>
      <td style="font-size:10px;">${dur}</td>
      <td>${snapCount}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px;">暂无任务</td></tr>';

  if (activeId) {
    renderTaskDetail(tasks, activeId);
  }
}

function selectTask(id) {
  _currentTaskId = id;
  fetch('/api/tasks').then(r => r.json()).then(j => {
    // 非运行时才切换日志到用户选中的任务；运行中日志固定显示运行任务
    if (!j.running) {
      renderTaskTable(j.tasks, j.running, j.current, j.elapsed);
      loadTaskLog(id);
    } else {
      // 运行中仅更新详情，日志保持显示运行任务
      renderTaskDetail(j.tasks, id);
    }
  });
}

function renderTaskDetail(tasks, tid) {
  const detail = $('task_detail');
  tid = tid || _currentTaskId;
  if (!tid) { detail.style.display = 'none'; detail.innerHTML = ''; return; }
  const t = tasks.find(x => x.id === tid);
  if (!t) { detail.style.display = 'none'; detail.innerHTML = ''; return; }
  const outs = (t.outputs || []).map(o =>
    `<a href="${o.url}" target="_blank">${o.name}</a>`).join(' · ') || '无';
  detail.style.display = 'block';
  detail.innerHTML =
    `<div style="margin-bottom:6px;">` +
    `<span class="status s-${t.status}">${t.status}</span> ` +
    `<span style="margin-left:8px;">开始: ${t.started || '-'}</span>` +
    `<span style="margin-left:8px;">完成: ${t.finished || '-'}</span>` +
    (t.error ? `<span style="margin-left:8px;color:var(--bad);">${t.error}</span>` : '') +
    `</div>` +
    `<div>输出文件: ${outs}</div>`;
}

async function loadTaskLog(id) {
  try {
    const r = await fetch('/api/task/' + id); const j = await r.json();
    const txt = j.log || '(暂无日志)';
    const el = $('log');
    if (el.textContent !== txt) {
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.textContent = txt;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
  } catch (e) {}
}

setInterval(refresh, 3000);
loadConfig().then(refresh);
</script>
</body>
</html>
